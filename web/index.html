<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The World · 创作星图</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/cosmic-galaxy.jpg" as="image">
  <link rel="stylesheet" href="/cosmic.css">
  <script src="/cosmic.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳至内容</a>
  <div class="cosmos" aria-hidden="true"><div class="galaxy"></div><div class="horizon"></div><canvas id="starfield"></canvas></div>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/"><span aria-hidden="true">✧</span> THE WORLD</a>
      <nav aria-label="主导航">
        <a href="/" aria-current="page"><span aria-hidden="true">⌂</span>首页</a>
        <a href="#works"><span aria-hidden="true">▤</span>我的作品</a>
        <a href="/studio.html#world"><span aria-hidden="true">◎</span>大世界</a>
        <a href="/studio.html#agents"><span aria-hidden="true">♧</span>AI Agent</a>
        <a href="/studio.html#memory"><span aria-hidden="true">▣</span>记忆审阅</a>
        <a href="/studio.html#settings"><span aria-hidden="true">⚙</span>模型设置</a>
      </nav>
    </aside>
    <main id="main">
      <header class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input type="search" id="work-search" aria-label="搜索作品" placeholder="搜索作品" autocomplete="off"><kbd>Ctrl+K</kbd></label>
        <button id="effects" class="quiet" type="button" aria-pressed="false">星空动效</button>
      </header>
      <div class="deck">
        <div class="primary-column">
          <section class="hero" aria-labelledby="title">
            <p class="welcome">Welcome to</p><h1 id="title">THE WORLD</h1>
            <p class="tagline">每一个故事，都是一个宇宙</p>
            <a id="start" class="launch" href="/studio.html"><span aria-hidden="true">✦</span> 开始创作 <span aria-hidden="true">›</span></a>
          </section>
          <section class="works" id="works" aria-labelledby="works-title">
            <div class="section-head"><h2 id="works-title"><span aria-hidden="true">◎</span> 我的作品</h2><button class="quiet" id="create" type="button">＋ 新建作品</button></div>
            <p id="works-status" class="muted" role="status">正在读取作品…</p>
            <div id="work-grid" class="work-grid"></div>
          </section>
          <section class="glass overview" aria-label="创作总览">
            <div class="overview-icon" aria-hidden="true">◉</div><div><h2>创作总览</h2><dl><div><dt>作品</dt><dd id="work-count">–</dd></div><div><dt>章节</dt><dd id="chapter-count">–</dd></div></dl></div>
          </section>
        </div>
        <aside class="right-column" aria-label="创作动态">
          <section class="glass agent">
            <div class="section-head"><h2><span aria-hidden="true">✧</span> AI Agent</h2><span id="agent-state" class="agent-state">读取中</span></div>
            <div class="orbital" aria-hidden="true"><i></i><i></i><div class="orb"></div></div>
            <p id="agent-project" class="muted"></p>
            <ul class="activity" id="agent-runs"></ul>
            <a class="quiet" href="/studio.html#tasks">任务与成本 <span aria-hidden="true">→</span></a>
          </section>
          <section class="glass recent">
            <div class="section-head"><h2><span aria-hidden="true">◷</span> 最近创作</h2></div>
            <ul class="activity" id="recent-works"><li class="muted">正在读取…</li></ul>
          </section>
        </aside>
      </div>
    </main>
  </div>
  <dialog id="create-dialog" class="glass">
    <form id="create-form">
      <h2>新建作品</h2>
      <label for="work-name">作品名称</label>
      <input id="work-name" name="name" maxlength="120" required>
      <p id="create-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="cancel-create" class="quiet" type="button">取消</button><button class="launch" type="submit">创建并进入</button></div>
    </form>
  </dialog>
</body>
</html>
